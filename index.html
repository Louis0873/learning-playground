<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习乐园 · 教师班级管理系统</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fc;color:#243451}button,input{font:inherit}button{border:0;cursor:pointer;border-radius:10px;padding:10px 14px;font-weight:700}input{padding:11px 13px;border:1px solid #d8dfed;border-radius:10px;outline:none}.app{display:flex;min-height:100vh}.side{width:230px;background:#172957;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:23px;font-weight:900;padding:0 10px 4px}.brand small{display:block;font-size:10px;font-weight:400;opacity:.6;margin-top:3px}.nav{margin-top:28px}.nav button{width:100%;background:transparent;color:#dbe4ff;text-align:left;margin:3px 0;padding:12px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:#2b4688;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.pageTitle{font-size:26px;font-weight:900}.date{color:#78859d;font-size:13px}.content{max-width:1250px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e5eaf3;border-radius:16px;padding:18px;box-shadow:0 5px 18px #2434510b;margin-bottom:16px}.stat b{display:block;font-size:28px;margin:8px 0}.stat span{color:#7b879d;font-size:13px}.blue{background:#2864e8;color:#fff}.green{background:#36b86b;color:#fff}.gold{background:#ffc83d;color:#634b00}.pink{background:#ee668b;color:#fff}.gray{background:#eef1f6;color:#45536c}.red{background:#ff7180;color:#fff}.sectionTitle{font-size:18px;font-weight:900;margin-bottom:14px}.row{display:flex;gap:8px}.row>*{flex:1}.studentRow{display:flex;align-items:center;justify-content:space-between;border:1px solid #edf0f5;border-radius:12px;padding:13px;margin:8px 0}.studentRow:hover{background:#f8faff}.avatar{width:40px;height:40px;border-radius:50%;background:#e9f0ff;color:#2864e8;display:flex;align-items:center;justify-content:center;font-weight:900;margin-right:10px}.studentInfo{display:flex;align-items:center;flex:1}.points{font-weight:900;color:#2864e8}.muted{font-size:12px;color:#8a95a8}.list{max-height:500px;overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left}.badge{display:inline-block;background:#eef3ff;color:#2864e8;padding:5px 9px;border-radius:20px;font-weight:700;font-size:12px}.wheelWrap{text-align:center}.wheel{width:430px;height:430px;max-width:90vw;margin:0 auto;position:relative}.wheel svg{width:100%;height:100%;filter:drop-shadow(0 8px 14px #253a641c)}.pointer{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #ef5c70;margin:0 auto -3px;position:relative;z-index:2}.draw{font-size:19px;padding:14px 44px;border-radius:28px;background:#2864e8;color:white;margin-top:10px}.result{margin:15px auto;padding:13px;background:#f7f9ff;border:1px solid #dce5ff;border-radius:12px;max-width:500px}.switch{width:48px;height:27px;background:#cdd3df;border-radius:20px;padding:3px}.switch i{display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:#36b86b}.switch.on i{margin-left:21px}.toggle{display:flex;align-items:center;justify-content:center;gap:10px}.profile{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profileHero{background:linear-gradient(135deg,#edf3ff,#fff);border:1px solid #dce5fa}.bigPoints{font-size:42px;font-weight:900;color:#2864e8}.reason{font-size:12px;color:#8a95a8;margin-top:3px}.historyItem{padding:12px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:12px}.empty{text-align:center;color:#9aa4b5;padding:30px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:center;justify-content:center;padding:20px}.modalBox{background:#fff;border-radius:22px;padding:30px;text-align:center;max-width:520px;width:100%;box-shadow:0 20px 70px #0005}.winnerName{font-size:44px;color:#ee668b;font-weight:900;margin:12px 0}.winnerIcon{font-size:58px}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{max-width:300px}.hide{display:none!important}.loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fc}.loginBox{width:380px;max-width:92%;background:#fff;border-radius:22px;padding:32px;box-shadow:0 18px 60px #24345118}.loginBox h1{text-align:center;margin:0 0 8px}.loginBox .muted{text-align:center;margin-bottom:22px}.loginBox input{margin-bottom:10px}.loginErr{color:#ee6677;text-align:center;min-height:22px;font-size:13px}.studentPortal{max-width:950px;margin:auto;padding:25px}.portalTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.portalCard{background:#fff;border-radius:18px;padding:22px;border:1px solid #e5eaf3;box-shadow:0 5px 18px #2434510b;margin-bottom:16px}@media(max-width:900px){.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px);padding:20px}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{position:relative;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:16px}.grid,.profile{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.wheel{width:330px;height:330px}}
</style>
</head>
<body>
<div id="loginScreen" class="loginScreen"><div class="loginBox"><h1>📚 学习乐园</h1><div class="muted">请选择登录入口</div>
<button class="blue" style="width:100%;margin-bottom:10px" onclick="showStudentLogin()">👨‍🎓 学生登录</button>
<button class="gray" style="width:100%" onclick="showTeacherLogin()">👨‍🏫 教师后台</button>
<div id="loginForms" class="hide"></div></div></div>
<div id="studentPortal" class="hide"></div>
<div id="teacherApp" class="app hide">
<aside class="side"><div class="brand">📚 学习乐园<small>Learning Playground</small></div><div class="nav">
<button data-page="home" onclick="go('home')">⌂　首页</button>
<button data-page="students" onclick="go('students')">♙　学生</button>
<button data-page="points" onclick="go('points')">★　积分管理</button>
<button data-page="wheel" onclick="go('wheel')">◉　转盘抽奖</button>
<button data-page="redeem" onclick="go('redeem')">🎁　兑换奖励</button>
<button data-page="records" onclick="go('records')">▤　积分记录</button>
<button data-page="accounts" onclick="go('accounts')">🔐　学生账号</button><button data-page="settings" onclick="go('settings')">⚙　设置</button>
</div></aside>
<main class="main"><div class="top"><div><div id="pageTitle" class="pageTitle">首页</div><div id="today" class="date"></div></div><span class="badge">教师班级管理</span></div><div id="content" class="content"></div></main>
</div>
</div>
<div id="winnerModal" class="modal"><div class="modalBox"><div class="winnerIcon">🏆</div><div>本次中奖学生</div><div id="winnerName" class="winnerName"></div><div id="winnerPoints" class="muted"></div><button class="blue" onclick="closeWinner()">好的</button></div></div>
<script>
const K="classLottery";
let s=JSON.parse(localStorage.getItem(K)||"null")||{students:[],history:[],auto:true};
s.students=(s.students||[]).map(x=>({...x,p:Number(x.p)||0,earned:Number(x.earned)||Number(x.p)||0,redeemed:x.redeemed||[],logs:x.logs||[],loginId:x.loginId||"",password:x.password||""}));
s.students.forEach(x=>recalcStudent(x));s.accounts=s.accounts||{};s.teacherPassword=s.teacherPassword||"123456";
let rewards=s.rewards||[{n:"表扬贴纸",p:1},{n:"小礼物",p:5},{n:"免一次作业",p:10}];s.rewards=rewards.map(r=>({n:String(r.n||"奖品"),p:Number(r.p)||0}));
let page="home",selected=null,spinning=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function recalcStudent(x){
  x.logs=x.logs||[];
  x.earned=x.logs.reduce((a,l)=>a+(Number(l.delta)>0?Number(l.delta):0),0);
  x.p=Math.max(0,x.logs.reduce((a,l)=>a+Number(l.delta||0),0));
}
function recalcAll(){
  s.students.forEach(recalcStudent);
}
function save(){recalcAll();localStorage.setItem(K,JSON.stringify(s));render()}
function today(){document.getElementById("today").textContent="📅 "+new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"})}
function go(p,id){page=p;if(id!==undefined)selected=id;render()}
function render(){today();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("pageTitle").textContent={home:"首页",students:"学生管理",points:"积分管理",wheel:"转盘抽奖",redeem:"兑换奖励",records:"积分记录",settings:"系统设置",accounts:"学生账号"}[page];let c=document.getElementById("content");if(page==="home")c.innerHTML=home();if(page==="students")c.innerHTML=studentsPage();if(page==="points")c.innerHTML=pointsPage();if(page==="wheel")c.innerHTML=wheelPage();if(page==="redeem")c.innerHTML=redeemPage();if(page==="records")c.innerHTML=recordsPage();if(page==="settings")c.innerHTML=settingsPage();if(page==="accounts")c.innerHTML=accountsPage();if(page==="wheel")renderWheel()}
function home(){let total=s.students.length,sum=s.students.reduce((a,x)=>a+x.p,0),top=[...s.students].sort((a,b)=>b.p-a.p).slice(0,5);return '<div class="grid"><div class="card stat"><span>学生人数</span><b>'+total+'</b><span>当前班级</span></div><div class="card stat"><span>当前总积分</span><b>'+sum+'</b><span>所有学生合计</span></div><div class="card stat"><span>今日日期</span><b style="font-size:19px">'+new Date().toLocaleDateString("zh-CN")+'</b><span>系统自动记录</span></div><div class="card stat"><span>抽奖记录</span><b>'+s.history.length+'</b><span>累计抽奖次数</span></div></div><div class="card"><div class="sectionTitle">🏆 当前积分排行榜</div>'+leaderHTML(top)+'</div><div class="card"><div class="sectionTitle">⚡ 快捷操作</div><div class="actions"><button class="blue" onclick="go(\'students\')">添加学生</button><button class="green" onclick="go(\'points\')">给学生加分</button><button class="gold" onclick="go(\'wheel\')">开始抽奖</button><button class="pink" onclick="go(\'redeem\')">兑换奖励</button></div></div>'}
function leaderHTML(a){return a.length?a.map((x,i)=>'<div class="studentRow"><div class="studentInfo"><div class="avatar">'+esc(x.n[0]||"?")+'</div><div><b>'+esc(x.n)+'</b><div class="muted">排名 '+(i+1)+'</div></div></div><span class="points">'+x.p+' 分</span></div>').join(""):'<div class="empty">还没有学生</div>'}
function studentsPage(){return '<div class="card"><div class="row"><input id="newStudent" placeholder="输入学生姓名"><button class="green" onclick="addStudent()">＋ 添加学生</button></div></div><div class="card"><div class="sectionTitle">👥 学生名单 <span class="muted">· 点击姓名进入个人档案</span></div><div class="list">'+(s.students.length?s.students.map((x,i)=>'<div class="studentRow"><div class="studentInfo" onclick="go(\'points\','+i+')" style="cursor:pointer"><div class="avatar">'+esc(x.n[0]||"?")+'</div><div><b>'+esc(x.n)+'</b><div class="muted">累计获得 '+x.earned+' 分 · 当前 '+x.p+' 分</div></div></div><div class="actions"><button class="blue" onclick="go(\'points\','+i+')">个人档案</button><button class="red" onclick="delStudent('+i+')">删除</button></div></div>').join(""):'<div class="empty">暂无学生，请先添加</div>')+'</div></div>'}
function pointsPage(){let x=selected!=null?s.students[selected]:null;if(!x)return '<div class="card"><div class="sectionTitle">选择学生</div>'+leaderHTML(s.students)+'</div>';return '<div class="profile"><div class="card profileHero"><div class="muted">学生个人档案</div><h2>👤 '+esc(x.n)+'</h2><div class="bigPoints">'+x.p+' 分</div><div class="muted">累计获得积分：'+x.earned+' 分</div><hr><div class="sectionTitle">快速加减分</div><div class="actions"><button class="green" onclick="change('+selected+',1,\'课堂表现\')">＋1</button><button class="green" onclick="change('+selected+',2,\'课堂表现\')">＋2</button><button class="green" onclick="change('+selected+',5,\'优秀表现\')">＋5</button><button class="red" onclick="change('+selected+',-1,\'扣分\')">－1</button><button class="red" onclick="change('+selected+',-5,\'扣分\')">－5</button></div><div style="margin-top:12px" class="row"><input id="reason" placeholder="加/扣分原因（可选）"><button class="blue" onclick="customChange('+selected+')">确认</button></div></div><div class="card"><div class="sectionTitle">📋 学生积分历史</div>'+profileLogs(x)+'</div></div>'}
function profileLogs(x){let a=[...(x.logs||[])].reverse();return a.length?a.map(function(l,j){let realIndex=x.logs.length-1-j;return '<div class="historyItem"><div><b>'+esc(l.reason)+'</b><div class="muted">'+l.t+'</div></div><div style="display:flex;align-items:center;gap:10px"><b style="color:'+(l.delta>=0?'#36a967':'#ee6677')+'">'+(l.delta>0?"+":"")+l.delta+' 分</b><button class="red" style="padding:5px 8px;font-size:11px" onclick="deleteStudentLog('+selected+','+realIndex+')">删除</button></div></div>'}).join(""):'<div class="empty">暂无积分记录</div>'}
function deleteStudentLog(i,j){
  if(!confirm("确定删除这条积分记录？删除后该记录对应的积分也会同步扣除。"))return;
  s.students[i].logs.splice(j,1);
  recalcStudent(s.students[i]);
  save();selected=i;go("points",i)
}
function redeemPage(){return '<div class="card"><div class="sectionTitle">🎁 兑换奖励</div><div class="muted" style="margin-bottom:15px">选择学生后兑换，系统会自动扣除积分并保存兑换记录。</div><div class="row"><select id="redeemStudent" onchange="selected=Number(this.value);render()"><option value="">请选择学生</option>'+s.students.map((x,i)=>'<option value="'+i+'" '+(selected===i?"selected":"")+'>'+esc(x.n)+' · '+x.p+'分</option>').join("")+'</select></div></div>'+(selected==null?'<div class="card"><div class="empty">请选择学生</div></div>':'<div class="card"><h2>👤 '+esc(s.students[selected].n)+'　<span class="points">'+s.students[selected].p+' 分</span></h2><div class="grid" style="grid-template-columns:repeat(3,1fr)">'+rewards.map(r=>'<div class="card" style="margin:0;border:1px solid #eee"><div style="font-size:24px">🎁</div><b>'+r.n+'</b><div class="muted" style="margin:8px 0">'+r.p+' 分</div><button class="gold" onclick="redeem('+selected+','+r.p+',\''+r.n+'\')">立即兑换</button></div>').join("")+'</div><hr><div class="sectionTitle">兑换记录</div>'+((s.students[selected].redeemed||[]).slice().reverse().map(r=>'<div class="historyItem"><span>🎁 '+esc(r.n)+'</span><span>-'+r.p+' 分 · '+r.t+'</span></div>').join("")||'<div class="empty">暂无兑换记录</div>')+'</div>')}
function accountsPage(){let out='<div class="card"><div class="sectionTitle">🔐 学生账号管理</div><div class="muted" style="margin-bottom:14px">给学生设置 ID 和密码。学生可以在登录页查看自己的积分、积分历史和兑换记录。</div>';if(!s.students.length){out+='<div class="empty">请先添加学生</div>'}else{s.students.forEach(function(x,i){out+='<div class="studentRow"><div class="studentInfo"><div class="avatar">'+esc(x.n[0]||"?")+'</div><div><b>'+esc(x.n)+'</b><div class="muted">ID：'+esc(x.loginId||"未设置")+'</div></div></div><div class="row" style="max-width:430px"><input id="aid'+i+'" placeholder="学生ID" value="'+esc(x.loginId||"")+'"><input id="apw'+i+'" placeholder="密码" value="'+esc(x.password||"")+'"><button class="blue" onclick="saveAccount('+i+')">保存</button></div></div>'})}out+='</div>';return out}
function recordsPage(){let a=s.history.slice().reverse();return '<div class="card"><div class="sectionTitle">▤ 全班积分 / 抽奖记录</div>'+(a.length?a.map(x=>'<div class="historyItem"><div><b>'+esc(x.n)+'</b><div class="muted">'+esc(x.r)+'</div></div><span>'+x.t+'</span></div>').join(""):'<div class="empty">暂无记录</div>')+'</div>'}
function settingsPage(){return '<div class="card"><div class="sectionTitle">⚙ 系统设置</div><div class="studentRow"><div><b>🎁 奖品设置</b><div class="muted">只有教师后台可以设置兑换奖品</div></div><button class="gold" onclick="manageRewards()">管理奖品</button></div><div class="studentRow"><div><b>教师后台密码</b><div class="muted">学生无法进入教师后台。首次使用默认密码：123456</div></div><div class="row" style="max-width:330px"><input id="teacherNewPw" type="password" placeholder="新教师密码"><button class="blue" onclick="saveTeacherPassword()">保存</button></div></div><div class="studentRow"><div><b>抽中后自动 +1 分</b><div class="muted">每次转盘抽中学生后自动增加 1 分</div></div><div id="sw" class="switch '+(s.auto?"on":"")+'" onclick="toggleAuto()"><i></i></div></div><div class="studentRow"><div><b>数据导出</b><div class="muted">导出学生、积分、兑换和记录</div></div><button class="blue" onclick="exportData()">导出 JSON</button></div><div class="studentRow"><div><b>退出教师后台</b><div class="muted">返回登录页面</div></div><button class="gray" onclick="teacherLogout()">退出</button></div><div class="studentRow"><div><b>清除抽奖记录</b><div class="muted">不会删除学生和积分</div></div><button class="gray" onclick="clearHistory()">清除</button></div><div class="studentRow"><div><b>清空全部学生</b><div class="muted">危险操作，会删除学生资料</div></div><button class="red" onclick="clearAll()">清空</button></div></div>'}
function wheelPage(){return '<div class="card wheelWrap"><div class="sectionTitle">🎡 随机抽学生</div><div class="muted">轮盘会根据当前学生名单自动生成姓名</div><div class="pointer"></div><div id="wheel" class="wheel"></div><button class="draw" onclick="draw()">开始抽奖</button><div id="result" class="result">🎁 准备好了吗？</div><div class="toggle"><span>抽中后自动 +1 分</span><div id="wheelSwitch" class="switch '+(s.auto?"on":"")+'" onclick="toggleAuto()"><i></i></div></div></div>'}
function renderWheel(){let el=document.getElementById("wheel");if(!el)return;if(!s.students.length){el.innerHTML='<div class="empty">请先添加学生</div>';return}let n=s.students.length,cx=215,cy=215,r=205,colors=["#ff6b6b","#4d8ee8","#42c777","#f29b4b","#9a6ee8","#ed6fa5","#2db7b0","#e2b63d"];let parts=s.students.map((x,i)=>{let a1=i*360/n-90,a2=(i+1)*360/n-90,rad=q=>q*Math.PI/180,pts=[cx,cy,cx+r*Math.cos(rad(a1)),cy+r*Math.sin(rad(a1)),cx+r*Math.cos(rad(a2)),cy+r*Math.sin(rad(a2))];let mid=(a1+a2)/2,tx=cx+(r*.58)*Math.cos(rad(mid)),ty=cy+(r*.58)*Math.sin(rad(mid));return '<path d="M '+cx+' '+cy+' L '+pts[2]+' '+pts[3]+' A '+r+' '+r+' 0 0 1 '+pts[4]+' '+pts[5]+' Z" fill="'+colors[i%colors.length]+'" stroke="#fff" stroke-width="3"/><text x="'+tx+'" y="'+ty+'" fill="#fff" font-size="'+(n>10?12:15)+'" font-weight="700" text-anchor="middle" dominant-baseline="middle" transform="rotate('+mid+' '+tx+' '+ty+')">'+esc(x.n)+'</text>'}).join("");el.innerHTML='<svg viewBox="0 0 430 430">'+parts+'<circle cx="215" cy="215" r="38" fill="#fff" stroke="#ffd447" stroke-width="7"/><text x="215" y="215" text-anchor="middle" dominant-baseline="middle" font-size="17" font-weight="900" fill="#74570c">GO</text></svg>'}
function addStudent(){let el=document.getElementById("newStudent"),n=el&&el.value.trim();if(!n)return alert("请输入姓名");if(s.students.some(x=>x.n===n))return alert("学生已存在");s.students.push({n,p:0,earned:0,redeemed:[],logs:[],loginId:"",password:""});el.value="";save();go("students")}
function delStudent(i){if(confirm("确定删除 "+s.students[i].n+"？")){s.students.splice(i,1);if(selected===i)selected=null;save();go("students")}}
function change(i,d,reason){
  let x=s.students[i];
  recalcStudent(x);
  if(d<0&&x.p+d<0)return alert("积分不能低于 0");
  x.logs=x.logs||[];
  x.logs.push({delta:d,reason:reason,t:new Date().toLocaleString("zh-CN")});
  recalcStudent(x);
  save()
}
function customChange(i){let v=prompt("请输入积分变动，例如 +3 或 -2");if(v===null)return;let d=Number(v);if(!d||!Number.isInteger(d))return alert("请输入整数");let r=document.getElementById("reason").value.trim()||"手动调整";change(i,d,r)}
function redeem(i,p,n){
  let x=s.students[i];recalcStudent(x);
  if(x.p<p)return alert("积分不足");
  if(!confirm(x.n+" 确定兑换「"+n+"」并扣除 "+p+" 分吗？"))return;
  x.redeemed=x.redeemed||[];
  x.redeemed.push({n,p,t:new Date().toLocaleString("zh-CN")});
  x.logs=x.logs||[];
  x.logs.push({delta:-p,reason:"兑换："+n,t:new Date().toLocaleString("zh-CN")});
  recalcStudent(x);save()
}
function toggleAuto(){s.auto=!s.auto;save()}
function playSound(){try{let A=window.AudioContext||window.webkitAudioContext,a=new A();if(a.state==="suspended")a.resume();let now=a.currentTime,master=a.createGain();master.gain.setValueAtTime(.0001,now);master.gain.linearRampToValueAtTime(.26,now+.08);master.gain.setValueAtTime(.26,now+2.45);master.gain.linearRampToValueAtTime(.34,now+2.9);master.gain.setValueAtTime(.34,now+4.35);master.gain.exponentialRampToValueAtTime(.0001,now+4.95);master.connect(a.destination);function tone(t,f,d,v,type){let o=a.createOscillator(),g=a.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}function tick(t,f,v){tone(t,f,.09,v||.3,"square");tone(t+.015,f*1.5,.06,(v||.3)*.35,"triangle")}function thump(t,v){tone(t,70,.18,v,"sine");tone(t+.02,125,.11,v*.5,"triangle")}tick(now+.05,180,.3);tick(now+.62,190,.32);tick(now+1.18,205,.34);tick(now+1.68,220,.36);tick(now+1.88,245,.4);tick(now+2.05,270,.44);tick(now+2.2,300,.48);tick(now+2.34,330,.54);tone(now+2.48,370,1.55,.16,"sawtooth");for(let i=0;i<10;i++){let t=now+2.52+i*.12;tone(t,420+i*32,.07,.18+i*.01,"square")}thump(now+4.18,.62);tone(now+4.24,58,.45,.42,"sine");thump(now+4.48,.82);tone(now+4.52,45,.42,.55,"sine");setTimeout(()=>a.close(),5800)}catch(e){}}function draw(){if(spinning)return;if(!s.students.length)return alert("请先添加学生");spinning=true;playSound();let i=Math.floor(Math.random()*s.students.length),x=s.students[i],el=document.getElementById("wheel");el.style.transition="transform 4.9s cubic-bezier(.08,.72,.18,1)";el.style.transform="rotate("+(2520+Math.random()*720)+"deg)";setTimeout(()=>{spinning=false;el.style.transition="none";currentWinner(x,i)},4950)}
function currentWinner(x,i){
  if(page!=="wheel")return;
  let result=document.getElementById("result");
  if(result)result.innerHTML="🎉 <b>"+esc(x.n)+"</b> 被抽中了！";
  if(s.auto){
    x.logs=x.logs||[];
    x.logs.push({delta:1,reason:"转盘抽奖",t:new Date().toLocaleString("zh-CN")});
    recalcStudent(x);
  }
  s.history.push({n:x.n,r:s.auto?"抽中 +1 分":"随机抽学生",t:new Date().toLocaleString("zh-CN")});
  localStorage.setItem(K,JSON.stringify(s));
  document.getElementById("winnerName").textContent=x.n;
  document.getElementById("winnerPoints").textContent=s.auto?"获得 +1 分！":"本次未自动加分";
  document.getElementById("winnerModal").style.display="flex";
  render()
}
function closeWinner(){document.getElementById("winnerModal").style.display="none"}
function saveAccount(i){let id=document.getElementById("aid"+i).value.trim(),pw=document.getElementById("apw"+i).value;if(!id||!pw)return alert("请输入学生ID和密码");if(s.students.some((x,j)=>j!==i&&x.loginId===id))return alert("这个学生ID已经被使用");s.students[i].loginId=id;s.students[i].password=pw;save();alert("账号已保存")}
function showStudentLogin(){loginForms.classList.remove("hide");loginForms.innerHTML='<h3>👨‍🎓 学生登录</h3><input id="loginId" placeholder="学生 ID"><input id="loginPw" type="password" placeholder="密码"><div id="loginErr" class="loginErr"></div><button class="blue" style="width:100%" onclick="studentLogin()">登录</button><button class="gray" style="width:100%;margin-top:8px" onclick="backLogin()">返回</button>'}
function showTeacherLogin(){loginForms.classList.remove("hide");loginForms.innerHTML='<h3>👨‍🏫 教师后台</h3><input id="teacherPw" type="password" placeholder="教师密码"><div id="loginErr" class="loginErr"></div><button class="blue" style="width:100%" onclick="teacherLogin()">进入后台</button><button class="gray" style="width:100%;margin-top:8px" onclick="backLogin()">返回</button>'}
function backLogin(){loginForms.classList.add("hide");loginForms.innerHTML=""}
function teacherLogin(){let pw=document.getElementById("teacherPw").value;if(pw!==s.teacherPassword){document.getElementById("loginErr").textContent="教师密码错误";return}document.getElementById("loginScreen").classList.add("hide");document.getElementById("teacherApp").classList.remove("hide");render()}
function studentLogin(){let id=document.getElementById("loginId").value.trim(),pw=document.getElementById("loginPw").value,i=s.students.findIndex(x=>x.loginId===id&&x.password===pw);if(i<0){document.getElementById("loginErr").textContent="学生 ID 或密码错误";return}document.getElementById("loginScreen").classList.add("hide");document.getElementById("teacherApp").classList.add("hide");showStudentPortal(i)}
function showStudentPortal(i){let x=s.students[i],logs=[...(x.logs||[])].reverse().map(l=>'<div class="historyItem"><span>'+esc(l.reason)+'<div class="muted">'+esc(l.t)+'</div></span><b style="color:'+(l.delta>=0?'#36a967':'#ee6677')+'">'+(l.delta>0?"+":"")+l.delta+' 分</b></div>').join(""),reds=[...(x.redeemed||[])].reverse().map(r=>'<div class="historyItem"><span>🎁 '+esc(r.n)+'</span><span>-'+r.p+' 分 · '+esc(r.t)+'</span></div>').join("");document.getElementById("studentPortal").classList.remove("hide");document.getElementById("studentPortal").innerHTML='<div class="studentPortal"><div class="portalTop"><div><div class="pageTitle">👋 '+esc(x.n)+'</div><div class="date">我的学习积分</div></div><button class="gray" onclick="studentLogout()">退出登录</button></div><div class="portalCard" style="text-align:center"><div class="muted">当前积分</div><div class="bigPoints">'+x.p+' 分</div><div class="muted">累计获得 '+x.earned+' 分</div></div><div class="portalCard"><div class="sectionTitle">📋 我的积分记录</div>'+(logs||'<div class="empty">暂无积分记录</div>')+'</div><div class="portalCard"><div class="sectionTitle">🎁 我的兑换记录</div>'+(reds||'<div class="empty">暂无兑换记录</div>')+'</div></div>'}
function teacherLogout(){document.getElementById("teacherApp").classList.add("hide");document.getElementById("loginScreen").classList.remove("hide");backLogin()}function studentLogout(){document.getElementById("studentPortal").classList.add("hide");document.getElementById("loginScreen").classList.remove("hide");document.getElementById("loginId").value="";document.getElementById("loginPw").value="";document.getElementById("loginErr").textContent=""}
function clearStudentLogs(i){
  if(!confirm("确定清除 "+s.students[i].n+" 的全部积分历史？清除后累计积分和当前积分都会同步归零。"))return;
  s.students[i].logs=[];
  recalcStudent(s.students[i]);
  save();selected=i;go("points",i)
}
function manageRewards(){let list=rewards.map((r,i)=>(i+1)+". "+r.n+" — "+r.p+"分").join("\n");let action=prompt("奖品设置\n\n"+(list||"暂无奖品")+"\n\n输入 1=新增，2=修改，3=删除，取消=返回");if(action==="1"){let n=prompt("请输入奖品名称");if(!n)return;let p=Number(prompt("请输入所需积分"));if(!Number.isInteger(p)||p<1)return alert("积分必须是大于 0 的整数");if(rewards.some(r=>r.n===n.trim()))return alert("奖品已存在");rewards.push({n:n.trim(),p});s.rewards=rewards;save();alert("奖品已添加")}else if(action==="2"){let i=Number(prompt("输入要修改的奖品编号"))-1;if(i<0||i>=rewards.length)return;let n=prompt("奖品名称",rewards[i].n);if(!n)return;let p=Number(prompt("所需积分",rewards[i].p));if(!Number.isInteger(p)||p<1)return alert("积分必须是大于 0 的整数");rewards[i]={n:n.trim(),p};s.rewards=rewards;save();alert("奖品已修改")}else if(action==="3"){let i=Number(prompt("输入要删除的奖品编号"))-1;if(i<0||i>=rewards.length)return;if(confirm("确定删除「"+rewards[i].n+"」？")){rewards.splice(i,1);s.rewards=rewards;save();alert("奖品已删除")}}}
function saveTeacherPassword(){let p=document.getElementById("teacherNewPw").value;if(!p)return alert("请输入新密码");if(p.length<4)return alert("密码至少 4 位");s.teacherPassword=p;save();alert("教师密码已更新")}function clearHistory(){if(confirm("确定清除所有抽奖记录？")){s.history=[];save()}}
function clearAll(){if(confirm("确定删除全部学生、积分及记录？")){s={students:[],history:[],auto:true};save();go("home")}}
function exportData(){let b=new Blob([JSON.stringify(s,null,2)],{type:"application/json;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="班级积分数据-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
setInterval(today,60000);render();
