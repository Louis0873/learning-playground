<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>班级积分抽奖系统</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff7f2,#ffe7dc);color:#4d475d}.wrap{max-width:1450px;margin:auto;padding:22px}.title{text-align:center;font-size:34px;color:#ef668e;text-shadow:2px 2px #ffd88e;margin:5px 0 22px}.grid{display:grid;grid-template-columns:290px 1fr 430px;gap:18px}.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 25px #8d716122;margin-bottom:18px}h2{margin:0 0 15px;color:#654d7d;font-size:20px}.row{display:flex;gap:8px}.row>*{flex:1}input,select{width:100%;padding:11px;border:1px solid #ddd4cf;border-radius:10px}button{border:0;border-radius:10px;padding:10px 13px;font-weight:bold;cursor:pointer}.blue{background:#5d91e8;color:white}.green{background:#65c978;color:white}.pink{background:#f16c8e;color:white}.gold{background:#ffc83d;color:#76540b}.gray{background:#eee}.red{background:#ff7180;color:white}.stat{display:flex;gap:10px;margin:14px 0}.stat div{flex:1;color:white;text-align:center;border-radius:12px;padding:14px;font-weight:bold}.a{background:#67c978}.b{background:#5b90e8}.list{max-height:500px;overflow:auto}.student{display:flex;justify-content:space-between;align-items:center;padding:9px;margin:7px 0;border:1px solid #eee3dd;border-radius:11px}.student.active{background:#fff2b8;border-color:#ffc72f}.name{font-weight:bold}.sub{font-size:12px;color:#888}.wheelbox{text-align:center}.current{background:#5d91e8;color:white;border-radius:12px;padding:13px;font-weight:bold}.pointer{margin:4px auto -5px;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #f0784b;position:relative;z-index:2}.wheel{width:350px;height:350px;border-radius:50%;margin:0 auto 18px;border:12px solid #ffe0a1;box-shadow:0 5px 15px #a7774c55;background:conic-gradient(#ef5b54 0 45deg,#4e94df 45deg 90deg,#31c76e 90deg 135deg,#f47b91 135deg 180deg,#ffd044 180deg 225deg,#68c879 225deg 270deg,#4f91e8 270deg 315deg,#a35bc0 315deg 360deg);position:relative}.wheel:after{content:"GO!";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:65px;height:65px;border-radius:50%;background:#ffd447;border:5px solid white;display:flex;align-items:center;justify-content:center;font-weight:900;color:#805e10}.draw{font-size:20px;padding:14px 42px;border-radius:28px;background:linear-gradient(90deg,#f36c91,#ff7d69);color:white}.result{margin:15px 0;padding:13px;border:2px solid #ffd12e;background:#fff9d2;border-radius:12px}.toggle{display:flex;justify-content:space-between;align-items:center}.switch{width:47px;height:26px;background:#ccc;border-radius:20px;padding:3px}.switch i{display:block;width:20px;height:20px;background:white;border-radius:50%}.switch.on{background:#64c979}.switch.on i{margin-left:21px}.prize{display:grid;grid-template-columns:1fr 65px 65px 38px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.prize input{padding:8px}.leader{max-height:280px;overflow:auto}.rank{display:flex;gap:9px;padding:9px;border-bottom:1px solid #eee}.rank b{flex:1}.badge{background:#fff0b7;padding:5px 8px;border-radius:13px;font-weight:bold}.history{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-height:220px;overflow:auto}.record{border:1px dashed #e3b6c3;border-radius:10px;padding:10px;text-align:center;background:#fffafa}.record small{color:#999}.empty{text-align:center;color:#aaa;padding:20px}@media(max-width:1100px){.grid{grid-template-columns:1fr 1fr}.right{grid-column:1/-1}}@media(max-width:720px){.grid{grid-template-columns:1fr}.wheel{width:285px;height:285px}.history{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<div class="title">🎓 班级积分抽奖系统 🎁</div>
<div class="grid">
<section class="card"><h2>👥 学生名单</h2><div class="row"><input id="student" placeholder="输入学生姓名"><button class="green" onclick="addStudent()">添加</button></div><div class="stat"><div class="a"><span id="total">0</span><br>总人数</div><div class="b"><span id="sum">0</span><br>总积分</div></div><div class="row"><button class="blue" onclick="demo()">加载示例</button><button class="green" onclick="clearStudents()">清空名单</button></div><div id="students" class="list"></div></section>
<section class="card wheelbox"><h2>🎡 随机抽学生</h2><div class="current">当前抽奖：<span id="current">尚未抽取</span></div><div class="pointer"></div><div id="wheel" class="wheel"></div><button class="draw" onclick="draw()">开始抽奖</button><div id="result" class="result">🎁 抽中的学生会显示在这里</div><div class="toggle"><span>抽中后自动 +1 分</span><div id="sw" class="switch on" onclick="toggle()"><i></i></div></div></section>
<section class="card right"><h2>🎁 奖励池</h2><div class="row"><input id="pname" placeholder="奖励名称"><input id="ppoints" type="number" placeholder="积分"><button class="green" onclick="addPrize()">添加</button></div><div id="prizes"></div><hr style="border:0;border-top:1px solid #eee;margin:18px 0"><h2>🏆 积分排行榜</h2><div id="board" class="leader"></div></section>
</div>
<section class="card"><h2>🏆 抽奖 / 积分记录</h2><div id="history" class="history"></div><div style="margin-top:12px;display:flex;gap:8px"><button class="blue" onclick="exportData()">📊 导出数据</button><button class="pink" onclick="resetAll()">♻️ 重置数据</button></div></section>
</div>
<script>
const K="classLottery";let s=JSON.parse(localStorage.getItem(K)||"null")||{students:[],prizes:[{n:"表扬贴纸",p:1},{n:"小礼物",p:5},{n:"免一次作业",p:10}],history:[],auto:true};
const save=()=>{localStorage.setItem(K,JSON.stringify(s));render()},esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){total.textContent=s.students.length;sum.textContent=s.students.reduce((a,x)=>a+x.p,0);sw.classList.toggle("on",s.auto);students.innerHTML=s.students.length?s.students.map((x,i)=>'<div class="student" id="s'+i+'"><div><div class="name">'+esc(x.n)+'</div><div class="sub">积分：'+x.p+'</div></div><div><button class="green" onclick="change('+i+',1)">+1</button> <button class="gray" onclick="change('+i+',-1)">-1</button> <button class="red" onclick="del('+i+')">×</button></div></div>').join(""):'<div class="empty">暂无学生</div>';prizes.innerHTML=s.prizes.map((x,i)=>'<div class="prize"><input value="'+esc(x.n)+'" onchange="editP('+i+',this.value)"><input type="number" value="'+x.p+'" onchange="editPP('+i+',this.value)"><span>分</span><button class="red" onclick="delP('+i+')">×</button></div>').join("");let a=[...s.students].sort((x,y)=>y.p-x.p);board.innerHTML=a.length?a.map((x,i)=>'<div class="rank"><span>'+(i+1)+'</span><b>'+esc(x.n)+'</b><span class="badge">'+x.p+' 分</span></div>').join(""):'<div class="empty">暂无积分</div>';history.innerHTML=s.history.length?s.history.slice().reverse().map(x=>'<div class="record"><b>'+esc(x.n)+'</b><br>🎁 '+esc(x.r)+'<br><small>'+x.t+'</small></div>').join(""):'<div class="empty" style="grid-column:1/-1">暂无记录</div>'}
function addStudent(){let n=student.value.trim();if(!n)return alert("请输入姓名");if(s.students.some(x=>x.n===n))return alert("学生已存在");s.students.push({n,p:0});student.value="";save()}function del(i){if(confirm("确定删除？")){s.students.splice(i,1);save()}}function clearStudents(){if(confirm("确定清空名单？")){s.students=[];save()}}function change(i,n){s.students[i].p=Math.max(0,s.students[i].p+n);save()}function toggle(){s.auto=!s.auto;save()}function addPrize(){let n=pname.value.trim(),p=+ppoints.value||0;if(!n)return alert("请输入奖励");s.prizes.push({n,p});pname.value="";ppoints.value="";save()}function editP(i,v){s.prizes[i].n=v;save()}function editPP(i,v){s.prizes[i].p=Math.max(0,+v||0);save()}function delP(i){s.prizes.splice(i,1);save()}
function draw(){if(!s.students.length)return alert("请先添加学生");let w=document.getElementById("wheel"),i=Math.floor(Math.random()*s.students.length),x=s.students[i];w.style.transition="none";w.style.transform="rotate(0deg)";setTimeout(()=>{w.style.transition="transform 2.5s cubic-bezier(.12,.75,.2,1)";w.style.transform="rotate("+(1800+Math.random()*900)+"deg)"},20);setTimeout(()=>{current.textContent=x.n;result.innerHTML="🎉 <b>"+esc(x.n)+"</b> 被抽中了！";document.querySelectorAll(".student").forEach(e=>e.classList.remove("active"));document.getElementById("s"+i).classList.add("active");let r="随机抽学生";if(s.auto){x.p++;r="抽中 +1 分"}s.history.push({n:x.n,r,t:new Date().toLocaleString("zh-CN")});save()},2600)}
function demo(){["王浩宇","李梓轩","张辰宇","刘俊熙","陈思源","赵梓涵","林俊杰","黄子恩","吴亦泽","杨博文"].forEach(n=>{if(!s.students.some(x=>x.n===n))s.students.push({n,p:0})});save()}function exportData(){let b=new Blob([JSON.stringify(s,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="班级积分数据.json";a.click()}function resetAll(){if(confirm("确定重置全部学生和记录？")){s={students:[],prizes:s.prizes,history:[],auto:true};save()}}render();
</script></body></html>
