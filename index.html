<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习乐园 · 教师班级管理系统</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fc;color:#243451}button,input{font:inherit}button{border:0;cursor:pointer;border-radius:10px;padding:10px 14px;font-weight:700}input{padding:11px 13px;border:1px solid #d8dfed;border-radius:10px;outline:none}.app{display:flex;min-height:100vh}.side{width:230px;background:#172957;color:#fff;padding:22px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:23px;font-weight:900;padding:0 10px 4px}.brand small{display:block;font-size:10px;font-weight:400;opacity:.6;margin-top:3px}.nav{margin-top:28px}.nav button{width:100%;background:transparent;color:#dbe4ff;text-align:left;margin:3px 0;padding:12px 14px;border-radius:10px}.nav button.active,.nav button:hover{background:#2b4688;color:#fff}.main{margin-left:230px;width:calc(100% - 230px);padding:28px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.pageTitle{font-size:26px;font-weight:900}.date{color:#78859d;font-size:13px}.content{max-width:1250px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#fff;border:1px solid #e5eaf3;border-radius:16px;padding:18px;box-shadow:0 5px 18px #2434510b;margin-bottom:16px}.stat b{display:block;font-size:28px;margin:8px 0}.stat span{color:#7b879d;font-size:13px}.blue{background:#2864e8;color:#fff}.green{background:#36b86b;color:#fff}.gold{background:#ffc83d;color:#634b00}.pink{background:#ee668b;color:#fff}.gray{background:#eef1f6;color:#45536c}.red{background:#ff7180;color:#fff}.sectionTitle{font-size:18px;font-weight:900;margin-bottom:14px}.row{display:flex;gap:8px}.row>*{flex:1}.studentRow{display:flex;align-items:center;justify-content:space-between;border:1px solid #edf0f5;border-radius:12px;padding:13px;margin:8px 0}.studentRow:hover{background:#f8faff}.avatar{width:40px;height:40px;border-radius:50%;background:#e9f0ff;color:#2864e8;display:flex;align-items:center;justify-content:center;font-weight:900;margin-right:10px}.studentInfo{display:flex;align-items:center;flex:1}.points{font-weight:900;color:#2864e8}.muted{font-size:12px;color:#8a95a8}.list{max-height:500px;overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid #edf0f5;text-align:left}.badge{display:inline-block;background:#eef3ff;color:#2864e8;padding:5px 9px;border-radius:20px;font-weight:700;font-size:12px}.wheelWrap{text-align:center}.wheel{width:430px;height:430px;max-width:90vw;margin:0 auto;position:relative}.wheel svg{width:100%;height:100%;filter:drop-shadow(0 8px 14px #253a641c)}.pointer{width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #ef5c70;margin:0 auto -3px;position:relative;z-index:2}.draw{font-size:19px;padding:14px 44px;border-radius:28px;background:#2864e8;color:white;margin-top:10px}.result{margin:15px auto;padding:13px;background:#f7f9ff;border:1px solid #dce5ff;border-radius:12px;max-width:500px}.switch{width:48px;height:27px;background:#cdd3df;border-radius:20px;padding:3px}.switch i{display:block;width:21px;height:21px;background:#fff;border-radius:50%;transition:.2s}.switch.on{background:#36b86b}.switch.on i{margin-left:21px}.toggle{display:flex;align-items:center;justify-content:center;gap:10px}.profile{display:grid;grid-template-columns:1fr 1fr;gap:16px}.profileHero{background:linear-gradient(135deg,#edf3ff,#fff);border:1px solid #dce5fa}.bigPoints{font-size:42px;font-weight:900;color:#2864e8}.reason{font-size:12px;color:#8a95a8;margin-top:3px}.historyItem{padding:12px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:12px}.empty{text-align:center;color:#9aa4b5;padding:30px}.modal{display:none;position:fixed;inset:0;background:#0007;z-index:50;align-items:center;justify-content:center;padding:20px}.modalBox{background:#fff;border-radius:22px;padding:30px;text-align:center;max-width:520px;width:100%;box-shadow:0 20px 70px #0005}.winnerName{font-size:44px;color:#ee668b;font-weight:900;margin:12px 0}.winnerIcon{font-size:58px}.actions{display:flex;gap:8px;flex-wrap:wrap}.search{max-width:300px}.hide{display:none!important}.loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f7fc}.loginBox{width:380px;max-width:92%;background:#fff;border-radius:22px;padding:32px;box-shadow:0 18px 60px #24345118}.loginBox h1{text-align:center;margin:0 0 8px}.loginBox .muted{text-align:center;margin-bottom:22px}.loginBox input{margin-bottom:10px}.loginErr{color:#ee6677;text-align:center;min-height:22px;font-size:13px}.studentPortal{max-width:950px;margin:auto;padding:25px}.petGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.petCard{background:linear-gradient(145deg,#fff,#f8fbff);border:1px solid #e3e9f5;border-radius:18px;padding:18px;box-shadow:0 5px 18px #2434510b}.petTop{display:flex;align-items:center;gap:12px}.petEmoji{width:72px;height:72px;border-radius:20px;background:#eef4ff;display:flex;align-items:center;justify-content:center;font-size:42px}.petName{font-size:18px;font-weight:900}.petLevel{color:#2864e8;font-weight:900}.progress{height:9px;background:#e9edf5;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#6f8ff5,#36b86b);border-radius:10px}.petCard .actions{margin-top:12px}.portalTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.portalCard{background:#fff;border-radius:18px;padding:22px;border:1px solid #e5eaf3;box-shadow:0 5px 18px #2434510b;margin-bottom:16px}@media(max-width:900px){.side{width:180px}.main{margin-left:180px;width:calc(100% - 180px);padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.petGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.side{position:relative;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:16px}.grid,.profile,.petGrid{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr);gap:4px}.wheel{width:330px;height:330px}}
</style>
</head>
<body>
<div id="loginScreen" class="loginScreen"><div class="loginBox"><h1>📚 学习乐园</h1><div class="muted">教师后台登录</div>
<input id="teacherPassword" type="password" placeholder="请输入教师密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')teacherLogin()">
<button class="gold" style="width:100%" onclick="teacherLogin()">🔐 登录教师后台</button>
<div class="loginErr" id="loginErr"></div>
</div></div>
<div id="studentPortal" class="hide"></div>
<div id="teacherApp" class="app hide">
<aside class="side"><div class="brand">📚 学习乐园<small>Learning Playground</small></div><div class="nav">
<button data-page="home" onclick="go('home')">⌂　首页</button>

<button data-page="points" onclick="go('points')">★　积分管理</button>
<button data-page="wheel" onclick="go('wheel')">◉　转盘抽奖</button>
<button data-page="redeem" onclick="go('redeem')">🎁　兑换奖励</button>
<button data-page="records" onclick="go('records')">▤　积分记录</button>
<button data-page="settings" onclick="go('settings')">⚙　设置</button>
</div></aside>
<main class="main"><div class="top"><div><div id="pageTitle" class="pageTitle">首页</div><div id="today" class="date"></div></div><span class="badge">教师班级管理</span></div><div id="content" class="content"></div></main>
</div>
</div>
<div id="winnerModal" class="modal"><div class="modalBox"><div class="winnerIcon">🏆</div><div>本次中奖学生</div><div id="winnerName" class="winnerName"></div><div id="winnerPoints" class="muted"></div><button class="blue" onclick="closeWinner()">好的</button></div></div>
<script>
const K="classLottery";
let s=JSON.parse(localStorage.getItem(K)||"null")||{students:[],history:[],auto:true};
s.students=(s.students||[]).map(x=>({...x,p:Number(x.p)||0,earned:Number(x.earned)||Number(x.p)||0,redeemed:x.redeemed||[],logs:x.logs||[],loginId:x.loginId||"",password:x.password||"",pet:{name:(x.pet&&x.pet.name)||"我的小恐龙",type:"🦖",exp:Number(x.pet&&x.pet.exp)||0}}));
s.students.forEach(x=>recalcStudent(x));s.accounts=s.accounts||{};s.teacherPassword=s.teacherPassword||"123456";
let rewards=s.rewards||[{n:"表扬贴纸",p:1},{n:"小礼物",p:5},{n:"免一次作业",p:10}];s.rewards=rewards.map(r=>({n:String(r.n||"奖品"),p:Number(r.p)||0}));
let page="home",selected=null,spinning=false;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showTeacherLogin(){
  const box=document.getElementById("loginForms");
  box.classList.remove("hide");
  box.innerHTML='<input id="teacherPassword" type="password" placeholder="请输入教师密码" autocomplete="current-password"><button class="gold" style="width:100%" onclick="teacherLogin()">🔐 登录教师后台</button><div class="loginErr" id="loginErr"></div>';
  document.getElementById("teacherPassword").focus();
}
function teacherLogin(){
  const input=document.getElementById("teacherPassword");
  const err=document.getElementById("loginErr");
  const pw=input ? input.value.trim() : "";
  const correct=(s&&s.teacherPassword)?String(s.teacherPassword):"123456";
  if(!pw){if(err)err.textContent="请输入教师密码";return false;}
  if(pw!==correct){
    if(err)err.textContent="密码错误，请输入正确密码";
    if(input){input.focus();input.select();}
    return false;
  }
  document.getElementById("loginScreen").classList.add("hide");
  document.getElementById("teacherApp").classList.remove("hide");
  page="home";
  render();
  return false;
}
function recalcStudent(x){
  x.logs=x.logs||[];
  x.earned=x.logs.reduce((a,l)=>a+(Number(l.delta)>0?Number(l.delta):0),0);
  x.p=Math.max(0,x.logs.reduce((a,l)=>a+Number(l.delta||0),0));
}
function recalcAll(){
  s.students.forEach(recalcStudent);
}
function save(){recalcAll();localStorage.setItem(K,JSON.stringify(s));render()}
function today(){const el=document.getElementById("today");if(!el)return;el.textContent="📅 "+new Date().toLocaleDateString("zh-CN",{year:"numeric",month:"long",day:"numeric",weekday:"long"})}
function go(p,id){page=p;if(id!==undefined)selected=id;render()}
function render(){today();document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));document.getElementById("pageTitle").textContent={home:"首页",students:"学生管理",points:"积分管理",wheel:"转盘抽奖",redeem:"兑换奖励",records:"积分记录",settings:"系统设置",accounts:""}[page];let c=document.getElementById("content");if(page==="home")c.innerHTML=home();if(page==="students")c.innerHTML=studentsPage();if(page==="points")c.innerHTML=pointsPage();if(page==="wheel")c.innerHTML=wheelPage();if(page==="redeem")c.innerHTML=redeemPage();if(page==="records")c.innerHTML=recordsPage();if(page==="settings")c.innerHTML=settingsPage();if(page==="wheel")renderWheel()}
function home(){let total=s.students.length,sum=s.students.reduce((a,x)=>a+x.p,0),top=[...s.students].sort((a,b)=>b.p-a.p).slice(0,5);return '<div class="grid"><div class="card stat"><span>学生人数</span><b>'+total+'</b><span>当前班级</span></div><div class="card stat"><span>当前总积分</span><b>'+sum+'</b><span>所有学生合计</span></div><div class="card stat"><span>今日日期</span><b style="font-size:19px">'+new Date().toLocaleDateString("zh-CN")+'</b><span>系统自动记录</span></div><div class="card stat"><span>抽奖记录</span><b>'+s.history.length+'</b><span>累计抽奖次数</span></div></div><div class="card"><div class="sectionTitle">⚡ 快捷操作</div><div class="actions"><button class="green" onclick="go('points')">给学生加分</button><button class="gold" onclick="go('wheel')">开始抽奖</button><button class="pink" onclick="go('redeem')">兑换奖励</button></div></div><div class="card" style="max-width:780px"><div class="sectionTitle">🏆 当前积分排行榜 <span class="muted">· 前 5 名</span></div>'+leaderHTML(top)+'</div><div class="card"><div class="sectionTitle">🦖 我的恐龙养成乐园</div><div class="muted" style="margin-bottom:14px">每位学生都有自己的恐龙蛋，用课堂积分照顾它，从蛋一步步养成成年恐龙。</div>'+petCardsHTML()+'</div></div>'}
function petLevel(exp){return Math.floor(Math.max(0,Number(exp)||0)/100)+1}
function petProgress(exp){return Math.max(0,Number(exp)||0)%100}
function petStage(x){let lv=petLevel(x.pet&&x.pet.exp);if(lv>=10)return"🦖";if(lv>=7)return"🦕";if(lv>=4)return"🦎";if(lv>=2)return"🐣";return"🥚"}
function petStageName(exp){let lv=petLevel(exp);if(lv>=10)return"成年恐龙";if(lv>=7)return"少年恐龙";if(lv>=4)return"小恐龙";if(lv>=2)return"孵化中的小恐龙";return"恐龙蛋"}
function petCardHTML(x,i){let exp=Number(x.pet&&x.pet.exp)||0,lv=petLevel(exp),prog=petProgress(exp);return '<div class="petCard"><div class="petTop"><div class="petEmoji">'+petStage(x)+'</div><div style="flex:1"><div class="petName">'+esc(x.pet.name||"我的小恐龙")+'</div><div class="muted">主人：'+esc(x.n)+'</div><div class="petLevel">Lv.'+lv+' · '+petStageName(exp)+' · '+exp+' XP</div></div></div><div style="margin:14px 0 6px;display:flex;justify-content:space-between;font-size:12px"><span>成长进度</span><b>'+prog+'/100 XP</b></div><div class="progress"><i style="width:'+prog+'%"></i></div><div class="muted" style="margin-top:10px">当前积分：<b class="points">'+x.p+' 分</b> · 照顾一次 2 分</div><div class="actions"><button class="gold" onclick="feedPet('+i+')">🍖 照顾 · 2分</button><button class="gray" onclick="setPet('+i+')">⚙ 命名</button><button class="blue" onclick="go('points',${i})">个人档案</button></div></div>'}
function petCardsHTML(){return s.students.length?s.students.map((x,i)=>petCardHTML(x,i)).join(""):'<div class="empty">还没有学生的恐龙蛋</div>'}
function setPet(i){let x=s.students[i],name=prompt("给 "+x.n+" 的恐龙取个名字：",x.pet.name||"我的小恐龙");if(name===null)return;name=name.trim();if(!name)return alert("恐龙名字不能为空");x.pet.name=name;x.pet.type="🦖";save();go(page,selected)}
function feedPet(i){let x=s.students[i];recalcStudent(x);if(x.p<2)return alert(x.n+" 的积分不足 2 分，暂时不能照顾恐龙！");if(!confirm("用 2 分照顾 "+x.pet.name+" 吗？\n恐龙 +10 XP"))return;x.logs=x.logs||[];x.logs.push({delta:-2,reason:"恐龙成长："+x.pet.name,t:new Date().toLocaleString("zh-CN")});x.pet.exp=(Number(x.pet.exp)||0)+10;recalcStudent(x);save();if(page==="students"||page==="home")go(page,selected)}
function showStudentPortal(i){let x=s.students[i];x.pet=x.pet||{name:"我的宠物",type:"🐶",exp:0};let logs=[...(x.logs||[])].reverse().map(l=>'<div class="historyItem"><span>'+esc(l.reason)+'<div class="muted">'+esc(l.t)+'</div></span><b style="color:'+(l.delta>=0?'#36a967':'#ee6677')+'">'+(l.delta>0?"+":"")+l.delta+' 分</b></div>').join(""),reds=[...(x.redeemed||[])].reverse().map(r=>'<div class="historyItem"><span>🎁 '+esc(r.n)+'</span><span>-'+r.p+' 分 · '+esc(r.t)+'</span></div>').join("");document.getElementById("studentPortal").classList.remove("hide");document.getElementById("studentPortal").innerHTML='<div class="studentPortal"><div class="portalTop"><div><div class="pageTitle">👋 '+esc(x.n)+'</div><div class="date">我的学习积分</div></div></div><div class="portalCard" style="text-align:center"><div class="muted">当前积分</div><div class="bigPoints">'+x.p+' 分</div><div class="muted">累计获得 '+x.earned+' 分</div></div><div class="portalCard"><div class="petTop"><div class="petEmoji">'+petStage(x)+'</div><div style="flex:1"><div class="petName">'+esc(x.pet.name||"我的宠物")+'</div><div class="muted">我的专属宠物 · Lv.'+petLevel(x.pet.exp)+'</div><div class="petLevel">'+x.pet.exp+' XP · '+petProgress(x.pet.exp)+'/50</div></div></div><div class="progress" style="margin-top:12px"><i style="width:'+(petProgress(x.pet.exp)*2)+'%"></i></div><div class="muted" style="margin-top:10px">使用 2 积分喂养一次，宠物获得 +10 XP。</div><button class="gold" style="margin-top:12px;width:100%" onclick="feedPet('+i+')">🍖 用 2 分喂养我的宠物</button></div><div class="portalCard"><div class="sectionTitle">📋 我的积分记录</div>'+(logs||'<div class="empty">暂无积分记录</div>')+'</div><div class="portalCard"><div class="sectionTitle">🎁 我的兑换记录</div>'+(reds||'<div class="empty">暂无兑换记录</div>')+'</div></div>'}
function teacherLogout(){document.getElementById("teacherApp").classList.add("hide");document.getElementById("loginScreen").classList.remove("hide");backLogin()}function studentLogout(){document.getElementById("studentPortal").classList.add("hide");document.getElementById("loginScreen").classList.remove("hide");document.getElementById("loginId").value="";document.getElementById("loginPw").value="";document.getElementById("loginErr").textContent=""}
function clearStudentLogs(i){
  if(!confirm("确定清除 "+s.students[i].n+" 的全部积分历史？清除后累计积分和当前积分都会同步归零。"))return;
  s.students[i].logs=[];
  recalcStudent(s.students[i]);
  save();selected=i;go("points",i)
}
function addReward(){let n=document.getElementById("newRewardName").value.trim(),p=Number(document.getElementById("newRewardPoints").value);if(!n||!Number.isInteger(p)||p<1)return alert("请输入奖品名称和有效积分");if(rewards.some(r=>r.n===n))return alert("这个奖品已经存在");rewards.push({n,p});s.rewards=rewards;save();go("settings")}
function saveReward(i){let n=document.getElementById("rewardName"+i).value.trim(),p=Number(document.getElementById("rewardPoints"+i).value);if(!n||!Number.isInteger(p)||p<1)return alert("请输入有效的奖品名称和积分");if(rewards.some((r,j)=>j!==i&&r.n===n))return alert("这个奖品已经存在");rewards[i]={n,p};s.rewards=rewards;save();go("settings")}
function deleteReward(i){if(!confirm("确定删除「"+rewards[i].n+"」？删除后不会影响已经产生的兑换记录。"))return;rewards.splice(i,1);s.rewards=rewards;save();go("settings")}
function saveTeacherPassword(){let p=document.getElementById("teacherNewPw").value;if(!p)return alert("请输入新密码");if(p.length<4)return alert("密码至少 4 位");s.teacherPassword=p;save();alert("教师密码已更新")}function clearHistory(){if(confirm("确定清除所有抽奖记录？")){s.history=[];save()}}
function clearAll(){if(confirm("确定删除全部学生、积分及记录？")){s={students:[],history:[],auto:true,teacherPassword:(s.teacherPassword||"123456"),rewards:(s.rewards||rewards)};save();go("home")}}
function exportData(){let b=new Blob([JSON.stringify(s,null,2)],{type:"application/json;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="班级积分数据-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
setInterval(today,60000);render();
</script>
</body></html>
